name: CS61C Project2
on:
  push:
    branches: [edidada/proj2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  venus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Original tests, calling convention, memcheck and student coverage
        run: bash scripts/verify_proj2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proj2-evidence
          path: |
            evidence/
            test-src/
          if-no-files-found: error
